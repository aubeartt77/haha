<script>
  /* 팁: 아래 'slotStatus'에서 각 달의 슬롯 동그라미 표기를 자유롭게 바꾸실 수 있습니다. 
     ● = 마감/작업중, ○ = 비었음, ◐ = 예약/대기중 */
  const slotStatus = [
    '●',
    '◐',
    '○'
  ];

  /* 팁: 여기에 의뢰자님 닉네임을 넣어주시면 슬롯 밑에 자동으로 표시됩니다.
     빈칸('')으로 두면 아무것도 표시되지 않아요. */
  const slotNickname = [
    '*******5님',
    '**라님',
    ''
  ];

  function renderSlots() {
    const container = document.getElementById('slotContainer');
    if (!container) return;

    const now = new Date();
    let html = '';

    for (let i = 0; i < 3; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const mName = (d.getMonth() + 1) + '월';
      const status = slotStatus[i] || '○';
      const nick = slotNickname[i] || '';

      const nickHtml = nick
        ? `<span class="nick">${nick}</span>`
        : '';

      html += `
        <div class="m">
          <span class="cap">${mName}</span>
          <span class="dotrow">${status}</span>
          ${nickHtml}
        </div>
      `;
    }

    container.innerHTML = html;
  }

  renderSlots();

  /* iframe 높이 자동 전달 */
  function sendHeight() {
    const height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    );

    window.parent.postMessage({
      frameHeight: height
    }, '*');
  }

  /* 페이지 및 이미지 로딩 후 높이 갱신 */
  window.addEventListener('load', function () {
    sendHeight();

    setTimeout(sendHeight, 300);
    setTimeout(sendHeight, 1000);
    setTimeout(sendHeight, 2000);
  });

  /* 화면 크기 변경 */
  window.addEventListener('resize', sendHeight);

  /* 내용 크기가 바뀌면 자동 갱신 */
  if (typeof ResizeObserver !== 'undefined') {
    const observer = new ResizeObserver(function () {
      sendHeight();
    });

    observer.observe(document.body);
  }

  /* 초기 실행 */
  sendHeight();
</script>
</body>
</html>
